<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="麦门大冒险 MaiMen Adventure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7E3"/>
      <stop offset="55%" stop-color="#FFEFC4"/>
      <stop offset="100%" stop-color="#FFE08A"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DA291C"/>
      <stop offset="100%" stop-color="#A81E14"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC72C" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FFC72C" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#A81E14" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="900" cy="70" r="200" fill="url(#glow)"/>

  <!-- 远景山丘 -->
  <path d="M0 330 Q 180 250 380 310 T 760 300 Q 980 250 1200 320 L1200 420 L0 420 Z" fill="#FFD98A" opacity=".55"/>
  <path d="M0 360 Q 240 300 470 350 T 900 340 Q 1060 310 1200 355 L1200 420 L0 420 Z" fill="#FFCE6B" opacity=".5"/>

  <!-- 麦门传送门 -->
  <g filter="url(#soft)">
    <path d="M120 340 L120 200 A 90 90 0 0 1 300 200 L300 340 Z" fill="url(#sky)"/>
    <path d="M146 340 L146 204 A 64 64 0 0 1 274 204 L274 340 Z" fill="#FFF3D0"/>
    <path d="M160 340 L160 210 A 50 50 0 0 1 260 210 L260 340 Z" fill="#FFC72C" opacity=".85"/>
    <!-- 门内光芒 -->
    <g opacity=".75">
      <rect x="185" y="240" width="10" height="100" rx="5" fill="#FFF7E3"/>
      <rect x="207" y="215" width="10" height="125" rx="5" fill="#FFF7E3"/>
      <rect x="229" y="250" width="10" height="90" rx="5" fill="#FFF7E3"/>
    </g>
  </g>

  <!-- 路径 -->
  <path d="M300 366 Q 620 330 900 366" stroke="#A81E14" stroke-width="4" stroke-dasharray="12 12" fill="none" opacity=".45"/>

  <!-- 文字 -->
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="360" y="130" font-size="68" font-weight="800" fill="#1A1512" letter-spacing="4">麦门大冒险</text>
    <text x="364" y="172" font-size="21" font-weight="700" fill="#DA291C" letter-spacing="6">MAIMEN ADVENTURE</text>
    <text x="364" y="222" font-size="23" fill="#4A3F38">把点餐变成一场 3 分钟的冒险</text>
    <text x="364" y="257" font-size="17" fill="#7A6A60">真实菜单 · 4 幕剧情 · 3 张命运菜单 · 确认后下单</text>

    <!-- 幕标签 -->
    <g font-size="15" font-weight="700">
      <rect x="364" y="288" width="90" height="34" rx="17" fill="#fff" opacity=".85"/>
      <text x="409" y="310" fill="#DA291C" text-anchor="middle">序章</text>
      <rect x="464" y="288" width="104" height="34" rx="17" fill="#fff" opacity=".85"/>
      <text x="516" y="310" fill="#DA291C" text-anchor="middle">补给试炼</text>
      <rect x="578" y="288" width="104" height="34" rx="17" fill="#fff" opacity=".85"/>
      <text x="630" y="310" fill="#DA291C" text-anchor="middle">风味神殿</text>
      <rect x="692" y="288" width="104" height="34" rx="17" fill="#fff" opacity=".85"/>
      <text x="744" y="310" fill="#DA291C" text-anchor="middle">同行之约</text>
      <rect x="806" y="288" width="100" height="34" rx="17" fill="#DA291C"/>
      <text x="856" y="310" fill="#fff" text-anchor="middle">BOSS 定餐</text>
    </g>
  </g>

  <!-- 右侧装饰：三道命运门 -->
  <g opacity=".85">
    <path d="M960 372 L960 288 A 40 40 0 0 1 1040 288 L1040 372 Z" fill="#DA291C" opacity=".18"/>
    <path d="M972 372 L972 292 A 28 28 0 0 1 1028 292 L1028 372 Z" fill="#FFC72C" opacity=".75"/>
    <path d="M1056 372 L1056 300 A 36 36 0 0 1 1128 300 L1128 372 Z" fill="#DA291C" opacity=".14"/>
    <path d="M1067 372 L1067 303 A 25 25 0 0 1 1117 303 L1117 372 Z" fill="#FFC72C" opacity=".6"/>
    <path d="M1142 372 L1142 312 A 28 28 0 0 1 1198 312 L1198 372 Z" fill="#DA291C" opacity=".1"/>
  </g>
</svg>
